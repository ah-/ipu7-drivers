# DKMS for Intel IPU7 (Panther Lake / IPU7.5) with the hardware ISP (PSYS) on Fedora.
# Always builds Intel's full out-of-tree trio: the PSYS driver needs the matching out-of-tree
# intel-ipu7 bus and ISYS (the in-kernel staging versions have a different struct layout).
# BUILD_INTEL_IPU_ACPI=1 is required for ISYS to bind the sensor through ipu_bridge.
PACKAGE_NAME="ipu7-ptl"
PACKAGE_VERSION="1.0"

MAKE[0]="make KERNELRELEASE=${kernelver} KERNEL_SRC=${kernel_source_dir} KV_IPU7_ISYS=999.0.0 BUILD_INTEL_IPU_ACPI=1 all-acpi"
CLEAN="make KERNELRELEASE=${kernelver} KERNEL_SRC=${kernel_source_dir} clean"
AUTOINSTALL="yes"

i=0
for m in intel-ipu7:drivers/media/pci/intel/ipu7 \
         intel-ipu7-isys:drivers/media/pci/intel/ipu7 \
         intel-ipu7-psys:drivers/media/pci/intel/ipu7/psys \
         ipu-acpi:drivers/media/platform/intel \
         ipu-acpi-pdata:drivers/media/platform/intel \
         ipu-acpi-common:drivers/media/platform/intel; do
    BUILT_MODULE_NAME[$i]="${m%%:*}"
    BUILT_MODULE_LOCATION[$i]="${m#*:}"
    DEST_MODULE_LOCATION[$i]="/updates"
    i=$((i + 1))
done
